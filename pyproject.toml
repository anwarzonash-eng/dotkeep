[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotkeep"
version = "0.2.0"
description = "Keep your dotfiles in one folder and symlink them into place."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zonash" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
dotkeep = "dotkeep.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
